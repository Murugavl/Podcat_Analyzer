services:
  - type: web
    name: echoscribe-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # "tiny" instead of "base" to keep Whisper's own footprint down on a
      # 512MB free instance. Bump to "base"/"small" once on a paid plan.
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"
      - key: LOG_FILE
        value: logs/podcast_analyzer.log
      # Set to the deployed Vercel URL(s), comma-separated, e.g.
      # https://echoscribe.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
    # Free plan doesn't support persistent disks, so model weights
    # re-download from Hugging Face whenever the instance restarts or
    # spins down from idle. Add a `disk:` block back (see git history)
    # once you move to a paid plan.

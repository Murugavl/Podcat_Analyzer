services:
  - type: web
    name: echoscribe-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"
      - key: LOG_FILE
        value: logs/podcast_analyzer.log
      # Set to the deployed Vercel URL(s), comma-separated, e.g.
      # https://echoscribe.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: model-cache
      mountPath: /root/.cache
      sizeGB: 10

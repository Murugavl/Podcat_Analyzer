<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236366f1%22 stroke-width=%222.2%22 stroke-linecap=%22round%22><line x1=%222%22 y1=%228.5%22 x2=%222%22 y2=%2215.5%22/><line x1=%226%22 y1=%224.5%22 x2=%226%22 y2=%2219.5%22/><line x1=%2210%22 y1=%227%22 x2=%2210%22 y2=%2217%22/><line x1=%2214%22 y1=%222.5%22 x2=%2214%22 y2=%2221.5%22/><line x1=%2218%22 y1=%229%22 x2=%2218%22 y2=%2215%22/><line x1=%2222%22 y1=%226%22 x2=%2222%22 y2=%2218%22/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echoscribe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply the saved / preferred theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('echoscribe-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var dark = saved ? saved === 'dark' : !prefersLight;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

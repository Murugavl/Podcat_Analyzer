server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Match backend/config.py's MAX_UPLOAD_SIZE_MB (default 100); nginx's own
  # default of 1MB would otherwise reject the upload with 413 before the
  # app's own size check ever runs.
  client_max_body_size 100M;

  location / {
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    proxy_pass http://backend:8000/api/;
    # Whisper transcription of a long file can take a while; don't let
    # nginx time the proxied request out underneath it.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
